spring:
  config:
    activate:
      on-profile: test

  # ── Exclude Kafka & Redis (no Docker needed for tests) ────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  # ── H2 In-Memory Database ──────────────────────────────────
  datasource:
    url: jdbc:h2:mem:hmis_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

  # ── JPA for H2 ─────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── Disable Flyway (H2 auto-creates from JPA) ─────────────
  flyway:
    enabled: false

# ── Swagger disabled in test ───────────────────────────────
springdoc:
  swagger-ui:
    enabled: false

# ── Logging ────────────────────────────────────────────────
logging:
  level:
    com.hmis: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ── JWT test secret (base64-encoded, >= 256 bits) ─────────
hmis:
  jwt:
    secret: dGVzdC1obWlzLXNlY3JldC1rZXktYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItdGVzdGluZy1vbmx5LWVuZA==
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://127.0.0.1,null"
  tenant:
    default-code: TEST_TENANT

server:
  port: 0
